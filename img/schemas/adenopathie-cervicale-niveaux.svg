<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#1f2937">Niveaux ganglionnaires cervicaux (I à VI)</text>
  <text x="20" y="54" font-size="14" fill="#4b5563">Vue latérale droite, schématique (visage vers la droite)</text>

  <!-- oreille / mastoïde (repère d'orientation) -->
  <ellipse cx="292" cy="98" rx="22" ry="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>

  <!-- mandibule -->
  <path d="M318,92 L348,186 L665,210 C680,200 690,185 692,170" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
  <text x="520" y="186" font-size="13" fill="#374151">mandibule</text>

  <!-- niveaux (polygones) -->
  <!-- Ia -->
  <polygon points="603,212 662,214 652,255 603,255" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <!-- Ib -->
  <polygon points="445,197 603,210 603,255 445,255" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <!-- II (IIa + IIb) -->
  <polygon points="277,145 335,140 352,190 445,197 445,255 341,255" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- III -->
  <polygon points="341,255 603,255 603,380 414,380" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <!-- IV -->
  <polygon points="414,380 603,380 603,555 520,555" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5"/>
  <!-- Va -->
  <polygon points="190,150 277,145 414,380 298,380" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
  <!-- Vb -->
  <polygon points="298,380 414,380 520,555 380,555" fill="#f9a8d4" stroke="#be185d" stroke-width="1.5"/>
  <!-- VI -->
  <polygon points="607,255 652,255 642,555 607,555" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- SCM (bande semi-transparente) -->
  <polygon points="270,135 330,130 585,558 520,558" fill="#92400e" fill-opacity="0.16" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="455" y="440" font-size="13" font-weight="bold" fill="#78350f" transform="rotate(59 455 440)">SCM</text>

  <!-- nerf XI (sépare IIa / IIb) -->
  <path d="M318,143 C330,185 335,220 342,255" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="337" y="172" font-size="12" font-weight="bold" fill="#111827">XI</text>

  <!-- trapèze -->
  <line x1="188" y1="148" x2="380" y2="558" stroke="#374151" stroke-width="3"/>
  <text x="168" y="330" font-size="13" fill="#374151" transform="rotate(64 168 330)">bord ant. du trapèze</text>

  <!-- lignes de repère -->
  <line x1="330" y1="255" x2="700" y2="255" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="612" y="250" width="34" height="10" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="705" y="259" font-size="13" fill="#111827">os hyoïde</text>
  <line x1="400" y1="380" x2="700" y2="380" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="705" y="384" font-size="13" fill="#111827">bord inférieur</text>
  <text x="705" y="400" font-size="13" fill="#111827">du cricoïde</text>
  <!-- clavicule -->
  <line x1="340" y1="562" x2="640" y2="570" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
  <text x="430" y="595" font-size="13" fill="#374151">clavicule</text>
  <text x="630" y="595" font-size="13" fill="#374151">manubrium</text>

  <!-- étiquettes de niveaux -->
  <text x="630" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350f">Ia</text>
  <text x="525" y="236" font-size="18" font-weight="bold" text-anchor="middle" fill="#78350f">Ib</text>
  <text x="300" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">IIb</text>
  <text x="395" y="228" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">IIa</text>
  <text x="520" y="322" font-size="20" font-weight="bold" text-anchor="middle" fill="#14532d">III</text>
  <text x="560" y="470" font-size="20" font-weight="bold" text-anchor="middle" fill="#4c1d95">IV</text>
  <text x="290" y="285" font-size="18" font-weight="bold" text-anchor="middle" fill="#831843">Va</text>
  <text x="410" y="490" font-size="18" font-weight="bold" text-anchor="middle" fill="#831843">Vb</text>
  <text x="626" y="420" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">VI</text>

  <!-- légende drainage -->
  <rect x="722" y="430" width="208" height="200" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="732" y="450" font-size="13" font-weight="bold" fill="#1f2937">Primitif à chercher</text>
  <text x="732" y="470" font-size="12" fill="#1f2937">I : lèvres, plancher, langue,</text>
  <text x="746" y="485" font-size="12" fill="#1f2937">gencive</text>
  <text x="732" y="503" font-size="12" fill="#1f2937">II : oropharynx, cavum,</text>
  <text x="746" y="518" font-size="12" fill="#1f2937">cavité buccale, parotide</text>
  <text x="732" y="536" font-size="12" fill="#1f2937">III-IV : larynx, hypopharynx,</text>
  <text x="746" y="551" font-size="12" fill="#1f2937">thyroïde (IV)</text>
  <text x="732" y="569" font-size="12" fill="#1f2937">V : cavum, oropharynx,</text>
  <text x="746" y="584" font-size="12" fill="#1f2937">cuir chevelu postérieur</text>
  <text x="732" y="602" font-size="12" fill="#1f2937">VI : thyroïde, larynx, trachée</text>
  <text x="732" y="620" font-size="12" fill="#1f2937">Sus-clav. G : thorax, abdomen</text>

  <!-- limites (rappel) -->
  <rect x="722" y="70" width="208" height="160" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="732" y="90" font-size="13" font-weight="bold" fill="#1f2937">Limites verticales</text>
  <text x="732" y="110" font-size="12" fill="#1f2937">II : base du crâne → hyoïde</text>
  <text x="732" y="128" font-size="12" fill="#1f2937">III : hyoïde → cricoïde</text>
  <text x="732" y="146" font-size="12" fill="#1f2937">IV : cricoïde → clavicule</text>
  <text x="732" y="164" font-size="12" fill="#1f2937">Va / Vb : au-dessus / au-</text>
  <text x="746" y="179" font-size="12" fill="#1f2937">dessous du cricoïde</text>
  <text x="732" y="197" font-size="12" fill="#1f2937">VI : hyoïde → sternum,</text>
  <text x="746" y="212" font-size="12" fill="#1f2937">entre les 2 carotides</text>
</svg>
