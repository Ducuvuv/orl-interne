<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Test de Dix-Hallpike — exemple : côté DROIT (canal postérieur droit)</text>
  <text x="480" y="52" font-size="14" text-anchor="middle" fill="#4b5563">Patient vu de son côté droit (l'examinateur se tient à droite et tient la tête à deux mains)</text>

  <!-- ===== Panneau 1 : assis ===== -->
  <text x="235" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">1. Assis, jambes allongées sur la table</text>
  <text x="235" y="112" font-size="14" text-anchor="middle" fill="#1f2937">tête tournée de 45° vers le côté testé (droit)</text>
  <!-- table -->
  <rect x="70" y="330" width="360" height="18" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <line x1="90" y1="348" x2="90" y2="400" stroke="#6b7280" stroke-width="4"/>
  <line x1="410" y1="348" x2="410" y2="400" stroke="#6b7280" stroke-width="4"/>
  <!-- tronc -->
  <rect x="100" y="215" width="50" height="115" rx="20" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
  <!-- jambes -->
  <rect x="135" y="303" width="215" height="27" rx="12" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
  <!-- tête de profil, visage vers la droite de l'image -->
  <circle cx="125" cy="185" r="27" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <path d="M150,180 L163,188 L150,194 Z" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <circle cx="140" cy="178" r="3" fill="#1f2937"/>

  <!-- encart vue de dessus -->
  <rect x="255" y="140" width="165" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="337" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">Tête vue de dessus</text>
  <!-- épaules (patient regardant vers la droite de l'image = vers ses pieds) -->
  <line x1="330" y1="175" x2="330" y2="255" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round"/>
  <text x="337" y="281" font-size="11" text-anchor="middle" fill="#4b5563">nez tourné vers l'épaule droite</text>
  <!-- axe neutre du regard -->
  <line x1="337" y1="215" x2="405" y2="215" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- tête : nez orienté à 45° vers le bas-droite = vers l'épaule droite du patient (côté examinateur) -->
  <circle cx="337" cy="215" r="22" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <path d="M349,232 L365,243 L356,225 Z" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <!-- oreille droite (côté atteint testé) en rouge -->
  <circle cx="321" cy="231" r="6" fill="#dc2626"/>
  <text x="305" y="248" font-size="12" font-weight="bold" fill="#dc2626">D</text>
  <circle cx="353" cy="199" r="6" fill="#6b7280"/>
  <text x="362" y="196" font-size="12" font-weight="bold" fill="#374151">G</text>
  <text x="392" y="236" font-size="13" font-weight="bold" fill="#1e3a8a">45°</text>

  <!-- flèche vers panneau 2 -->
  <line x1="440" y1="250" x2="510" y2="250" stroke="#1f2937" stroke-width="3" marker-end="url(#fl)"/>
  <text x="475" y="238" font-size="12" text-anchor="middle" fill="#1f2937">rapidement</text>

  <!-- ===== Panneau 2 : couché tête en extension ===== -->
  <text x="725" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">2. Allongé d'un bloc sur le dos</text>
  <text x="725" y="112" font-size="14" text-anchor="middle" fill="#1f2937">tête dans le vide, extension 20-30° sous l'horizontale,</text>
  <text x="725" y="130" font-size="14" text-anchor="middle" fill="#1f2937">toujours tournée de 45° à droite (oreille droite en bas)</text>
  <!-- table -->
  <rect x="590" y="330" width="340" height="18" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <line x1="610" y1="348" x2="610" y2="400" stroke="#6b7280" stroke-width="4"/>
  <line x1="910" y1="348" x2="910" y2="400" stroke="#6b7280" stroke-width="4"/>
  <!-- tronc couché -->
  <rect x="610" y="300" width="125" height="30" rx="14" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
  <!-- jambes -->
  <rect x="725" y="303" width="185" height="27" rx="12" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
  <!-- cou en extension -->
  <line x1="612" y1="312" x2="585" y2="328" stroke="#92400e" stroke-width="10" stroke-linecap="round"/>
  <!-- tête plus basse que la table, visage vers le plafond -->
  <circle cx="563" cy="340" r="27" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <path d="M556,314 L551,299 L566,312 Z" fill="#fcd9b6" stroke="#92400e" stroke-width="2"/>
  <circle cx="571" cy="324" r="3" fill="#1f2937"/>
  <!-- repère horizontal et angle -->
  <line x1="612" y1="312" x2="520" y2="312" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="300" font-size="13" font-weight="bold" fill="#1e3a8a">20-30°</text>
  <!-- encart observation -->
  <rect x="470" y="410" width="470" height="100" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="485" y="432" font-size="14" font-weight="bold" fill="#1e3a8a">Observer les yeux (lunettes de Frenzel / vidéonystagmoscopie) :</text>
  <text x="485" y="452" font-size="13" fill="#1f2937">• latence de quelques secondes, puis vertige + nystagmus TORSIONNEL</text>
  <text x="485" y="469" font-size="13" fill="#1f2937">  géotropique (pôle supérieur de l'œil vers l'oreille droite, en bas)</text>
  <text x="485" y="486" font-size="13" fill="#1f2937">  + VERTICAL vers le haut (vers le front), crescendo-decrescendo, &lt; 60 s</text>
  <text x="485" y="503" font-size="13" fill="#1f2937">• au retour assis : nystagmus de sens inverse fréquent</text>

  <!-- consignes générales -->
  <rect x="20" y="410" width="430" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="35" y="432" font-size="14" font-weight="bold" fill="#991b1b">À retenir</text>
  <text x="35" y="452" font-size="13" fill="#1f2937">• Tester les deux côtés ; le côté positif = oreille en bas.</text>
  <text x="35" y="469" font-size="13" fill="#1f2937">• Prévenir le patient (vertige intense bref, nausées).</text>
  <text x="35" y="486" font-size="13" fill="#1f2937">• Prudence : rachis cervical, carotides/vertébrales, obésité.</text>
  <text x="35" y="503" font-size="13" fill="#1f2937">• Test négatif seulement après ≥ 30 s d'observation.</text>
</svg>
