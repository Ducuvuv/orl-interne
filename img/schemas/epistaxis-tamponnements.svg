<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ===================== Panneau A ===================== -->
  <text x="235" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2937">A. Tamponnement antérieur</text>
  <text x="235" y="52" font-size="14" text-anchor="middle" fill="#4b5563">Coupe sagittale, paroi latérale · narine à gauche</text>

  <!-- fosse nasale -->
  <path d="M40,330 L70,290 C85,220 110,170 150,140 L330,110 L380,160 L405,230 L405,330 Z" fill="#fdf2f2" stroke="#9f1239" stroke-width="2.5"/>
  <!-- cornet moyen -->
  <path d="M170,215 C230,185 330,190 385,215 C330,232 230,235 170,215 Z" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.5"/>
  <text x="280" y="212" font-size="12" text-anchor="middle" fill="#831843">cornet moyen</text>
  <!-- cornet inférieur -->
  <path d="M110,280 C190,245 330,248 390,275 C330,296 190,298 110,280 Z" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.5"/>
  <text x="250" y="277" font-size="12" text-anchor="middle" fill="#831843">cornet inférieur</text>
  <!-- palais / plancher -->
  <path d="M40,342 L405,342" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>
  <text x="225" y="368" font-size="13" text-anchor="middle" fill="#374151">plancher = palais</text>
  <!-- cavum -->
  <path d="M405,170 C450,180 465,230 462,300 C460,340 450,380 440,410" fill="none" stroke="#9f1239" stroke-width="2.5"/>
  <text x="438" y="250" font-size="12" text-anchor="middle" fill="#374151">cavum</text>

  <!-- tampon / mèche le long du plancher -->
  <rect x="58" y="306" width="290" height="28" rx="12" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="203" y="325" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">tampon / mèche</text>
  <!-- fil -->
  <path d="M58,320 C40,330 30,345 25,372" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="20" y="390" font-size="12" fill="#1e3a8a">fil fixé à la joue</text>

  <!-- bonne direction -->
  <path d="M70,400 L330,400" stroke="#1d4ed8" stroke-width="4" marker-end="url(#fl)"/>
  <text x="200" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Introduire horizontalement, le long du plancher</text>
  <text x="200" y="444" font-size="14" text-anchor="middle" fill="#1d4ed8">(parallèle au palais, jusqu'en arrière)</text>
  <!-- mauvaise direction -->
  <path d="M95,285 L140,170" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#flr)"/>
  <text x="105" y="160" font-size="22" font-weight="bold" fill="#b91c1c">✗</text>
  <text x="20" y="92" font-size="13" fill="#b91c1c">Ne pas viser vers le haut</text>
  <text x="20" y="108" font-size="13" fill="#b91c1c">(toit, lame criblée)</text>

  <text x="20" y="480" font-size="14" fill="#1f2937">• Avant : mouchage, anesthésie locale + vasoconstricteur</text>
  <text x="20" y="502" font-size="14" fill="#1f2937">• Mèche grasse : tasser en accordéon d'arrière en avant</text>
  <text x="20" y="524" font-size="14" fill="#1f2937">• Tampon expansif : l'hydrater au sérum une fois en place</text>
  <text x="20" y="546" font-size="14" fill="#1f2937">• Contrôler l'oropharynx : plus d'écoulement postérieur</text>
  <text x="20" y="568" font-size="14" fill="#1f2937">• Noter l'heure de pose et le matériel</text>

  <!-- séparateur -->
  <line x1="480" y1="20" x2="480" y2="585" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===================== Panneau B ===================== -->
  <text x="725" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2937">B. Sonde à double ballonnet</text>
  <text x="725" y="52" font-size="14" text-anchor="middle" fill="#4b5563">Tamponnement antéro-postérieur</text>

  <g transform="translate(490,0)">
    <path d="M40,330 L70,290 C85,220 110,170 150,140 L330,110 L380,160 L405,230 L405,330 Z" fill="#fdf2f2" stroke="#9f1239" stroke-width="2.5"/>
    <path d="M170,215 C230,185 330,190 385,215 C330,232 230,235 170,215 Z" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.5"/>
    <path d="M110,280 C190,245 330,248 390,275 C330,296 190,298 110,280 Z" fill="#fbcfe8" stroke="#9f1239" stroke-width="1.5"/>
    <path d="M40,342 L405,342" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>
    <path d="M405,170 C450,180 465,230 462,300 C460,340 450,380 440,410" fill="none" stroke="#9f1239" stroke-width="2.5"/>

    <!-- sonde -->
    <path d="M5,322 L425,322" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    <!-- ballonnet antérieur (fosse nasale) -->
    <ellipse cx="225" cy="312" rx="150" ry="24" fill="#86efac" fill-opacity="0.85" stroke="#15803d" stroke-width="2.5"/>
    <!-- ballonnet postérieur (cavum, contre la choane) -->
    <ellipse cx="432" cy="312" rx="26" ry="34" fill="#fca5a5" fill-opacity="0.9" stroke="#b91c1c" stroke-width="2.5"/>
    <!-- valves -->
    <circle cx="10" cy="300" r="7" fill="#15803d"/>
    <circle cx="10" cy="345" r="7" fill="#b91c1c"/>

    <text x="225" y="380" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">② ballonnet antérieur : fosse nasale</text>
    <text x="355" y="420" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">① ballonnet postérieur :</text>
    <text x="355" y="438" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">cavum, bloque la choane</text>
  </g>

  <text x="500" y="480" font-size="14" fill="#1f2937">1. Introduire dégonflée le long du plancher jusqu'au cavum</text>
  <text x="500" y="502" font-size="14" fill="#1f2937">2. Gonfler le ballonnet postérieur, traction douce (choane)</text>
  <text x="500" y="524" font-size="14" fill="#1f2937">3. Gonfler le ballonnet antérieur (volumes : notice)</text>
  <text x="500" y="546" font-size="14" fill="#1f2937">4. Noter volumes et heure ; protéger la narine (escarre)</text>
  <text x="500" y="568" font-size="14" fill="#1f2937">5. Dégonfler progressivement dès 24-48 h · maximum 72 h</text>
</svg>
