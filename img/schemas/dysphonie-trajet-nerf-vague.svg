<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="640" fill="#ffffff"/>
<text x="400" y="28" font-size="20" text-anchor="middle" font-weight="bold" fill="#222">Trajet du nerf vague (X) et des nerfs récurrents — vue de face</text>
<text x="30" y="56" font-size="12" fill="#555">Droite du patient</text>
<text x="540" y="56" font-size="12" fill="#555" text-anchor="end">Gauche du patient</text>

<!-- bandes de niveaux -->
<rect x="20" y="66" width="540" height="64" fill="#f3f4f6"/>
<rect x="20" y="130" width="540" height="270" fill="#fafafa"/>
<rect x="20" y="400" width="540" height="180" fill="#f3f4f6"/>
<text x="28" y="84" font-size="12" font-weight="bold" fill="#607d8b">BASE DU CRÂNE</text>
<text x="28" y="148" font-size="12" font-weight="bold" fill="#607d8b">COU</text>
<text x="28" y="418" font-size="12" font-weight="bold" fill="#607d8b">THORAX</text>

<!-- tronc cérébral -->
<rect x="330" y="72" width="100" height="34" rx="12" fill="#e3e8ef" stroke="#78909c" stroke-width="1.2"/>
<text x="380" y="94" font-size="12" text-anchor="middle" fill="#222">Tronc cérébral</text>
<circle cx="300" cy="124" r="5" fill="#90a4ae"/>
<circle cx="460" cy="124" r="5" fill="#90a4ae"/>
<text x="380" y="128" font-size="10" text-anchor="middle" fill="#555">foramens jugulaires</text>

<!-- larynx, trachée, thyroïde -->
<rect x="352" y="170" width="56" height="66" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.2"/>
<text x="380" y="207" font-size="12" text-anchor="middle" fill="#222">Larynx</text>
<rect x="362" y="236" width="36" height="250" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1"/>
<text x="380" y="330" font-size="11" text-anchor="middle" fill="#555" transform="rotate(-90 380 330)">Trachée</text>
<ellipse cx="342" cy="270" rx="20" ry="30" fill="#f8bbd0" fill-opacity="0.75" stroke="#c2185b" stroke-width="1"/>
<ellipse cx="418" cy="270" rx="20" ry="30" fill="#f8bbd0" fill-opacity="0.75" stroke="#c2185b" stroke-width="1"/>
<text x="432" y="318" font-size="10" text-anchor="middle" fill="#c2185b">Thyroïde</text>

<!-- carotides -->
<line x1="290" y1="135" x2="290" y2="392" stroke="#e57373" stroke-width="7"/>
<line x1="472" y1="135" x2="472" y2="408" stroke="#e57373" stroke-width="7"/>
<text x="240" y="160" font-size="11" fill="#c62828">Carotide</text>
<text x="482" y="160" font-size="11" fill="#c62828">Carotide</text>

<!-- récurrent gauche (dessiné avant la crosse : passe en arrière) -->
<path d="M 486 424 C 488 448, 480 458, 464 458 C 446 458, 430 448, 420 430 L 408 236" fill="none" stroke="#f9a825" stroke-width="4"/>

<!-- tronc brachiocéphalique et sous-clavière droite -->
<path d="M 392 448 C 360 420, 320 400, 292 392" fill="none" stroke="#e57373" stroke-width="9"/>
<path d="M 292 392 C 250 380, 200 384, 120 398" fill="none" stroke="#e57373" stroke-width="9"/>
<text x="60" y="380" font-size="11" fill="#c62828">Artère sous-clavière droite</text>

<!-- crosse de l'aorte -->
<path d="M 370 560 C 368 470, 410 420, 462 418 C 515 418, 540 460, 540 570" fill="none" stroke="#d32f2f" stroke-width="18"/>
<path d="M 488 420 C 520 400, 560 395, 560 395" fill="none" stroke="#e57373" stroke-width="7"/>
<text x="470" y="598" font-size="12" fill="#c62828" text-anchor="middle">Crosse de l'aorte</text>

<!-- vague droit -->
<path d="M 300 128 C 282 170, 274 220, 274 300 C 274 360, 266 380, 262 420 L 254 576" fill="none" stroke="#f9a825" stroke-width="4"/>
<!-- récurrent droit : boucle sous la sous-clavière -->
<path d="M 266 372 C 262 400, 270 412, 286 412 C 300 412, 312 400, 330 360 C 345 320, 352 270, 354 236" fill="none" stroke="#f9a825" stroke-width="4"/>

<!-- vague gauche (passe en avant de la crosse) -->
<path d="M 460 128 C 478 170, 486 220, 486 300 C 486 360, 486 400, 486 440 L 492 576" fill="none" stroke="#f9a825" stroke-width="4"/>

<!-- étiquettes nerfs -->
<text x="160" y="250" font-size="12" font-weight="bold" fill="#b26a00">Nerf vague</text>
<text x="160" y="266" font-size="12" font-weight="bold" fill="#b26a00">droit (X)</text>
<text x="496" y="250" font-size="12" font-weight="bold" fill="#b26a00">Nerf vague</text>
<text x="496" y="266" font-size="12" font-weight="bold" fill="#b26a00">gauche (X)</text>
<text x="36" y="446" font-size="11" fill="#b26a00">Récurrent droit :</text>
<text x="36" y="461" font-size="11" fill="#b26a00">boucle sous la</text>
<text x="36" y="476" font-size="11" fill="#b26a00">sous-clavière</text>
<text x="300" y="520" font-size="11" fill="#b26a00" text-anchor="end">Récurrent gauche :</text>
<text x="300" y="535" font-size="11" fill="#b26a00" text-anchor="end">boucle sous la crosse</text>
<text x="300" y="550" font-size="11" fill="#b26a00" text-anchor="end">(trajet thoracique long)</text>
<line x1="304" y1="530" x2="462" y2="460" stroke="#b26a00" stroke-width="1" stroke-dasharray="3,3"/>

<!-- causes par niveau -->
<rect x="572" y="66" width="214" height="64" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.2"/>
<text x="580" y="84" font-size="11" fill="#222">Tumeur (glomus, neurinome,</text>
<text x="580" y="99" font-size="11" fill="#222">métastase), chirurgie de la</text>
<text x="580" y="114" font-size="11" fill="#222">base du crâne, AVC du tronc</text>
<rect x="572" y="136" width="214" height="258" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.2"/>
<text x="580" y="158" font-size="11" font-weight="bold" fill="#222">Cou</text>
<text x="580" y="178" font-size="11" fill="#222">• Thyroïdectomie (1re cause</text>
<text x="580" y="193" font-size="11" fill="#222">   iatrogène), cancer thyroïdien</text>
<text x="580" y="213" font-size="11" fill="#222">• Chirurgie carotidienne,</text>
<text x="580" y="228" font-size="11" fill="#222">   rachis cervical antérieur</text>
<text x="580" y="248" font-size="11" fill="#222">• Adénopathie maligne</text>
<text x="580" y="268" font-size="11" fill="#222">• Œsophage cervical</text>
<rect x="572" y="400" width="214" height="180" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.2"/>
<text x="580" y="422" font-size="11" font-weight="bold" fill="#222">Thorax (surtout à gauche)</text>
<text x="580" y="440" font-size="11" fill="#222">• Cancer bronchique : apex</text>
<text x="580" y="455" font-size="11" fill="#222">   droit, médiastin gauche</text>
<text x="580" y="473" font-size="11" fill="#222">• Cancer de l'œsophage</text>
<text x="580" y="491" font-size="11" fill="#222">• Adénopathies médiastinales</text>
<text x="580" y="509" font-size="11" fill="#222">• Anévrisme de la crosse</text>
<text x="580" y="527" font-size="11" fill="#222">• Chirurgie cardiaque,</text>
<text x="580" y="542" font-size="11" fill="#222">   aortique, pulmonaire,</text>
<text x="580" y="557" font-size="11" fill="#222">   œsophagienne, thymique</text>

<rect x="20" y="604" width="766" height="28" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
<text x="403" y="623" font-size="13" text-anchor="middle" fill="#222">Paralysie inexpliquée → TDM injectée de la base du crâne jusqu'à la fenêtre aorto-pulmonaire</text>
</svg>
