<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <text x="360" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Canule de trachéotomie : les éléments à connaître</text>
  <text x="360" y="49" font-size="13" text-anchor="middle" fill="#555">Canule à ballonnet, à chemise interne (± fenêtrée) — schéma, vue de profil</text>

  <!-- tube externe -->
  <path d="M122,215 L240,215 A110,110 0 0 1 350,325 L350,420" fill="none" stroke="#8d8d8d" stroke-width="36" stroke-linecap="butt"/>
  <path d="M122,215 L240,215 A110,110 0 0 1 350,325 L350,420" fill="none" stroke="#f2f2f2" stroke-width="26" stroke-linecap="butt"/>
  <!-- chemise interne -->
  <path d="M100,215 L240,215 A110,110 0 0 1 350,325 L350,424" fill="none" stroke="#42a5f5" stroke-width="7" stroke-dasharray="10,5"/>
  <!-- fenetre (sur la convexite) -->
  <ellipse cx="331" cy="233" rx="9" ry="5" transform="rotate(45 331 233)" fill="#37474f"/>
  <!-- ballonnet -->
  <ellipse cx="350" cy="375" rx="34" ry="30" fill="#ffd54f" fill-opacity="0.75" stroke="#b28704" stroke-width="1.5"/>
  <!-- collerette -->
  <rect x="110" y="140" width="13" height="150" rx="4" fill="#607d8b"/>
  <rect x="104" y="140" width="25" height="12" rx="3" fill="#455a64"/>
  <rect x="104" y="278" width="25" height="12" rx="3" fill="#455a64"/>
  <!-- connecteur 15 mm -->
  <rect x="72" y="198" width="38" height="34" rx="4" fill="#bdbdbd" stroke="#757575" stroke-width="1.5"/>
  <!-- ligne du ballonnet temoin -->
  <path d="M135,205 C150,150 190,118 228,112" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
  <ellipse cx="244" cy="110" rx="17" ry="11" fill="#ffd54f" fill-opacity="0.85" stroke="#b28704" stroke-width="1.5"/>
  <rect x="261" y="104" width="16" height="12" rx="2" fill="#90a4ae" stroke="#607d8b"/>

  <!-- ===== legendes ===== -->
  <g font-size="12.5" fill="#222">
    <!-- 1 connecteur -->
    <line x1="72" y1="215" x2="40" y2="215" stroke="#555" stroke-width="1"/>
    <line x1="40" y1="215" x2="40" y2="330" stroke="#555" stroke-width="1"/>
    <text x="14" y="348" font-weight="bold">Connecteur 15 mm</text>
    <text x="14" y="364">(ballon, ECH, valve,</text>
    <text x="14" y="380">bouchon)</text>
    <!-- 2 collerette -->
    <line x1="116" y1="290" x2="150" y2="440" stroke="#555" stroke-width="1"/>
    <text x="100" y="456" font-weight="bold">Collerette</text>
    <text x="100" y="472">taille + modèle inscrits ;</text>
    <text x="100" y="488">cordon : 1 doigt de jeu</text>
    <!-- 3 ballonnet temoin -->
    <line x1="277" y1="110" x2="440" y2="88" stroke="#555" stroke-width="1"/>
    <text x="444" y="80" font-weight="bold">Ballonnet témoin + valve</text>
    <text x="444" y="96">gonfler à l'AIR, puis contrôler au</text>
    <text x="444" y="112">manomètre : 20-25 cmH₂O (≤ 30)</text>
    <!-- 4 fenetre -->
    <line x1="338" y1="226" x2="440" y2="170" stroke="#555" stroke-width="1"/>
    <text x="444" y="160" font-weight="bold">Fenêtre (canule fenêtrée)</text>
    <text x="444" y="176">air vers le larynx → voix, toux ;</text>
    <text x="444" y="192">aspirer et ventiler avec la chemise</text>
    <text x="444" y="208">interne NON fenêtrée en place</text>
    <!-- 5 chemise interne -->
    <line x1="296" y1="232" x2="440" y2="262" stroke="#1e88e5" stroke-width="1"/>
    <text x="444" y="252" font-weight="bold" fill="#1565c0">Chemise interne (amovible)</text>
    <text x="444" y="268">retirée, contrôlée (± nettoyée) / 8 h ;</text>
    <text x="444" y="284" font-weight="bold">canule bouchée → la retirer en 1er</text>
    <!-- 6 ballonnet -->
    <line x1="384" y1="375" x2="440" y2="352" stroke="#555" stroke-width="1"/>
    <text x="444" y="344" font-weight="bold">Ballonnet (basse pression)</text>
    <text x="444" y="360">étanchéité trachéale (sang, salive) ;</text>
    <text x="444" y="376">valve phonatoire ou bouchon :</text>
    <text x="444" y="392" font-weight="bold" fill="#c62828">ballonnet TOTALEMENT dégonflé</text>
  </g>
  <rect x="430" y="420" width="282" height="72" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="571" y="439" font-size="12" font-weight="bold" text-anchor="middle" fill="#6d4c00">Au lit, en permanence</text>
  <text x="571" y="456" font-size="11.5" text-anchor="middle" fill="#333">canule même taille + taille inférieure, mandrin,</text>
  <text x="571" y="471" font-size="11.5" text-anchor="middle" fill="#333">seringue, manomètre, lubrifiant, dilatateur,</text>
  <text x="571" y="486" font-size="11.5" text-anchor="middle" fill="#333">aspiration + sondes, O₂, ciseaux</text>
</svg>
