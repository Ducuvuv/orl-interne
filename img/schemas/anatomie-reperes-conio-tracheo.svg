<text x="150.0" y="296.0" font-size="14" text-anchor="end" font-weight="bold" fill="#b71c1c">CONIOTOMIE</text>
<text x="150.0" y="313.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">incision transversale</text>
<text x="150.0" y="330.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">de la membrane</text>
<line x1="156.0" y1="425.0" x2="302.0" y2="430.0" stroke="#444" stroke-width="1.1"/>
<circle cx="302.0" cy="430.0" r="3" fill="#444"/>
<text x="150.0" y="430.0" font-size="14" text-anchor="end" font-weight="bold" fill="#0d47a1">TRACHÉOTOMIE</text>
<text x="150.0" y="447.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">2e à 4e anneau (jamais</text>
<text x="150.0" y="464.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">sous le 4e) ; isthme</text>
<text x="150.0" y="481.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">récliné ou sectionné</text>
<line x1="156.0" y1="555.0" x2="290.0" y2="392.0" stroke="#444" stroke-width="1.1"/>
<circle cx="290.0" cy="392.0" r="3" fill="#444"/>
<text x="150.0" y="560.0" font-size="14" text-anchor="end" font-weight="bold" fill="#6d4c41">NE PAS inciser</text>
<text x="150.0" y="577.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">le 1er anneau ni</text>
<text x="150.0" y="594.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">le cricoïde (risque de</text>
<text x="150.0" y="611.0" font-size="13" text-anchor="end" font-weight="normal" fill="#333">sténose sous-glottique)</text>
<line x1="546.0" y1="95.0" x2="448.0" y2="98.0" stroke="#444" stroke-width="1.1"/>
<circle cx="448.0" cy="98.0" r="3" fill="#444"/>
<text x="552.0" y="100.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Os hyoïde</text>
<line x1="546.0" y1="165.0" x2="372.0" y2="160.0" stroke="#444" stroke-width="1.1"/>
<circle cx="372.0" cy="160.0" r="3" fill="#444"/>
<text x="552.0" y="170.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Cartilage thyroïde</text>
<text x="552.0" y="187.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">incisure, proéminence</text>
<text x="552.0" y="204.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">(pomme d'Adam)</text>
<line x1="546.0" y1="281.0" x2="396.0" y2="318.0" stroke="#444" stroke-width="1.1"/>
<circle cx="396.0" cy="318.0" r="3" fill="#444"/>
<text x="552.0" y="286.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Membrane</text>
<text x="552.0" y="303.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">crico-thyroïdienne</text>
<text x="552.0" y="320.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">(dépression palpable</text>
<text x="552.0" y="337.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">sous le thyroïde)</text>
<line x1="546.0" y1="361.0" x2="420.0" y2="356.0" stroke="#444" stroke-width="1.1"/>
<circle cx="420.0" cy="356.0" r="3" fill="#444"/>
<text x="552.0" y="366.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Cartilage cricoïde</text>
<text x="552.0" y="383.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">seul anneau complet</text>
<line x1="546.0" y1="447.0" x2="410.0" y2="442.5" stroke="#444" stroke-width="1.1"/>
<circle cx="410.0" cy="442.5" r="3" fill="#444"/>
<text x="552.0" y="452.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Isthme thyroïdien</text>
<text x="552.0" y="469.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">devant les anneaux</text>
<text x="552.0" y="486.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">2-3 (parfois 4)</text>
<line x1="546.0" y1="555.0" x2="412.0" y2="542.0" stroke="#444" stroke-width="1.1"/>
<circle cx="412.0" cy="542.0" r="3" fill="#444"/>
<text x="552.0" y="560.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Anneaux trachéaux</text>
<line x1="546.0" y1="653.0" x2="405.0" y2="644.0" stroke="#444" stroke-width="1.1"/>
<circle cx="405.0" cy="644.0" r="3" fill="#444"/>
<text x="552.0" y="658.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Fourchette sternale</text>
<text x="350.0" y="724.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#333">Repère au doigt : glisser de la proéminence thyroïdienne vers le bas jusqu'à la dépression = membrane crico-thyroïdienne.</text>
</svg>