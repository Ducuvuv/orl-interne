<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="600" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222">Dépistage néonatal de la surdité (HAS 2025)</text>
<text x="380.0" y="52.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">Chaque oreille, seuil 35 dB, consentement parental — « 1-3-6 » : dépistage &lt; 1 mois, diagnostic &lt; 3 mois, prise en charge ≤ 6 mois</text>
<rect x="40" y="70" width="560" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="50.0" y="89.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">T1 — maternité, idéalement à 48 h de vie</text>
<text x="50.0" y="109.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">PEAA privilégiés (OEA acceptés en attendant l'équipement)</text>
<text x="50.0" y="128.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Facteur de risque : PEAA d'emblée ; néonatologie : PEAA seuls, ≥ 36 SA</text>
<line x1="320.0" y1="146.0" x2="320.0" y2="168.0" stroke="#1565c0" stroke-width="1.8"/>
<polygon points="320.0,168.0 315.3,159.2 324.7,159.2" fill="#1565c0"/>
<text x="330.0" y="162.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c62828">non concluant</text>
<rect x="40" y="170" width="560" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="50.0" y="189.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">T2 — si T1 non concluant : PEAA avant la sortie</text>
<text x="50.0" y="209.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Sortie &lt; 48 h / naissance à domicile / non dépisté → 1 test de rattrapage PEAA</text>
<text x="50.0" y="228.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">avant 1 mois d'âge corrigé</text>
<line x1="320.0" y1="246.0" x2="320.0" y2="268.0" stroke="#1565c0" stroke-width="1.8"/>
<polygon points="320.0,268.0 315.3,259.2 324.7,259.2" fill="#1565c0"/>
<text x="330.0" y="262.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c62828">non concluant</text>
<rect x="40" y="270" width="560" height="76" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
<text x="50.0" y="289.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">T3 — si T2 non concluant : PEAA au plus tard à 1 mois (âge corrigé)</text>
<text x="50.0" y="309.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Rendez-vous fixé AVANT la sortie de maternité</text>
<text x="50.0" y="328.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">(ORL, pédiatre, PMI, sage-femme, IDE/puéricultrice…)</text>
<line x1="320.0" y1="346.0" x2="320.0" y2="368.0" stroke="#f9a825" stroke-width="1.8"/>
<polygon points="320.0,368.0 315.3,359.2 324.7,359.2" fill="#f9a825"/>
<text x="330.0" y="362.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c62828">non concluant</text>
<rect x="40" y="370" width="560" height="76" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
<text x="50.0" y="389.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Diagnostic : équipe pluridisciplinaire, idéalement à 1 mois, avant 3 mois</text>
<text x="50.0" y="409.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">PEA diagnostiques (seuils), OEA, tympanométrie, examen ORL et général</text>
<text x="50.0" y="428.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Suspicion de surdité → rechercher un CMV congénital (PCR salive/urines, avant J21)</text>
<line x1="320.0" y1="446.0" x2="320.0" y2="468.0" stroke="#c62828" stroke-width="1.8"/>
<polygon points="320.0,468.0 315.3,459.2 324.7,459.2" fill="#c62828"/>
<text x="330.0" y="462.0" font-size="12" text-anchor="start" font-weight="bold" fill="#2e7d32">surdité confirmée</text>
<rect x="40" y="470" width="560" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="50.0" y="489.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Prise en charge au plus tard à 6 mois</text>
<text x="50.0" y="509.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Appareillage précoce, orthophonie/guidance parentale, CAMSP</text>
<text x="50.0" y="528.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Surdité profonde : implant cochléaire (idéalement avant 12 mois)</text>
<rect x="612" y="70" width="136" height="236" rx="8" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.4"/>
<text x="622.0" y="89.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Test concluant</text>
<text x="622.0" y="106.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">à n'importe</text>
<text x="622.0" y="123.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">quelle étape</text>
<text x="622.0" y="140.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">→ arrêt du</text>
<text x="622.0" y="157.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">dépistage</text>
<text x="622.0" y="174.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222"></text>
<text x="622.0" y="191.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">MAIS suivi</text>
<text x="622.0" y="208.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">auditif si</text>
<text x="622.0" y="225.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">facteur de risque</text>
<text x="622.0" y="242.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">de surdité</text>
<text x="622.0" y="259.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">tardive (CMV,</text>
<text x="622.0" y="276.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">ATCD familiaux…)</text>
<text x="380.0" y="576.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" font-style="italic">Refus parental : noter « non dépisté à la demande des parents » dans le carnet de santé.</text>
</svg>