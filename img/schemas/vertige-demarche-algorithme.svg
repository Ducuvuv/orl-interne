<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="710" fill="#ffffff"/>

  <text x="480" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Vertige aigu : orientation selon le profil temporel et les déclencheurs</text>

  <!-- étape 0 -->
  <rect x="20" y="45" width="560" height="78" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="35" y="67" font-size="14" font-weight="bold" fill="#1f2937">1. Est-ce un vertige ? (illusion de mouvement)</text>
  <text x="35" y="87" font-size="13" fill="#1f2937">Éliminer : lipothymie/malaise, hypotension orthostatique, trouble du rythme,</text>
  <text x="35" y="104" font-size="13" fill="#1f2937">hypoglycémie, cause médicamenteuse. Perte de connaissance = pas vestibulaire.</text>
  <text x="35" y="119" font-size="12" fill="#4b5563">Otoscopie systématique (cholestéatome, otite, hémotympan, vésicules).</text>

  <!-- red flags -->
  <rect x="595" y="45" width="345" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="66" font-size="14" font-weight="bold" fill="#991b1b">2. Drapeaux rouges → filière AVC d'emblée</text>
  <text x="610" y="85" font-size="12" fill="#1f2937">céphalée / cervicalgie inhabituelle, signe neurologique</text>
  <text x="610" y="101" font-size="12" fill="#1f2937">(diplopie, dysarthrie, dysphagie, déficit, ataxie),</text>
  <text x="610" y="117" font-size="12" fill="#1f2937">impossibilité de tenir debout/marcher, surdité brusque</text>

  <!-- trois colonnes -->
  <!-- colonne A -->
  <rect x="20" y="140" width="290" height="70" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="165" y="163" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">A. ÉPISODIQUE DÉCLENCHÉ</text>
  <text x="165" y="182" font-size="12" text-anchor="middle" fill="#1f2937">crises de secondes (&lt; 1 min), déclenchées</text>
  <text x="165" y="198" font-size="12" text-anchor="middle" fill="#1f2937">par un changement de position de la tête</text>

  <rect x="20" y="225" width="290" height="62" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="35" y="246" font-size="13" font-weight="bold" fill="#1f2937">Dix-Hallpike des 2 côtés</text>
  <text x="35" y="263" font-size="12" fill="#1f2937">puis roll test couché si négatif</text>
  <text x="35" y="279" font-size="12" fill="#1f2937">(examen hors crise : pas de nystagmus spontané)</text>

  <rect x="20" y="300" width="290" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="35" y="321" font-size="13" font-weight="bold" fill="#166534">Typique → VPPB</text>
  <text x="35" y="338" font-size="12" fill="#1f2937">manœuvre libératoire (Sémont, Epley ;</text>
  <text x="35" y="354" font-size="12" fill="#1f2937">Lempert/Gufoni si canal latéral) ;</text>
  <text x="35" y="368" font-size="12" fill="#1f2937">pas d'imagerie, pas de médicament</text>

  <rect x="20" y="390" width="290" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="35" y="412" font-size="13" font-weight="bold" fill="#991b1b">Atypique → IRM (central ?)</text>
  <text x="35" y="429" font-size="12" fill="#1f2937">nystagmus vertical inférieur, sans latence,</text>
  <text x="35" y="445" font-size="12" fill="#1f2937">durable, non épuisable, sans vertige,</text>
  <text x="35" y="461" font-size="12" fill="#1f2937">signes neuro, échec de manœuvres répétées</text>
  <text x="35" y="475" font-size="12" fill="#4b5563">DD : hypotension orthostatique (au lever)</text>

  <!-- colonne B -->
  <rect x="335" y="140" width="290" height="70" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="480" y="163" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">B. ÉPISODIQUE SPONTANÉ</text>
  <text x="480" y="182" font-size="12" text-anchor="middle" fill="#1f2937">crises spontanées de minutes à heures,</text>
  <text x="480" y="198" font-size="12" text-anchor="middle" fill="#1f2937">récidivantes, examen souvent normal</text>

  <rect x="335" y="225" width="290" height="62" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="350" y="246" font-size="13" font-weight="bold" fill="#1f2937">+ surdité, acouphène, plénitude</text>
  <text x="350" y="263" font-size="12" fill="#1f2937">fluctuants unilatéraux (20 min-12 h)</text>
  <text x="350" y="279" font-size="12" fill="#1f2937">→ maladie de Menière (audiogramme)</text>

  <rect x="335" y="300" width="290" height="76" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="350" y="321" font-size="13" font-weight="bold" fill="#1f2937">+ céphalée migraineuse, photo/</text>
  <text x="350" y="338" font-size="13" font-weight="bold" fill="#1f2937">phonophobie, ATCD de migraine</text>
  <text x="350" y="356" font-size="12" fill="#1f2937">→ migraine vestibulaire (5 min-72 h)</text>

  <rect x="335" y="390" width="290" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="350" y="412" font-size="13" font-weight="bold" fill="#991b1b">1er(s) épisode(s) récent(s), sujet</text>
  <text x="350" y="429" font-size="13" font-weight="bold" fill="#991b1b">vasculaire, sans signe cochléaire</text>
  <text x="350" y="447" font-size="12" fill="#1f2937">→ AIT vertébrobasilaire jusqu'à preuve</text>
  <text x="350" y="463" font-size="12" fill="#1f2937">du contraire : avis neurovasculaire,</text>
  <text x="350" y="477" font-size="12" fill="#1f2937">IRM + imagerie artérielle en urgence</text>

  <!-- colonne C -->
  <rect x="650" y="140" width="290" height="70" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="795" y="163" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">C. AIGU CONTINU</text>
  <text x="795" y="182" font-size="12" text-anchor="middle" fill="#1f2937">vertige permanent depuis des heures/jours,</text>
  <text x="795" y="198" font-size="12" text-anchor="middle" fill="#1f2937">nausées, nystagmus spontané, instabilité</text>

  <rect x="650" y="225" width="290" height="62" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="665" y="246" font-size="13" font-weight="bold" fill="#1f2937">HINTS+ (examinateur formé)</text>
  <text x="665" y="263" font-size="12" fill="#1f2937">Head Impulse · Nystagmus · Test of Skew</text>
  <text x="665" y="279" font-size="12" fill="#1f2937">+ audition (frottement des doigts)</text>

  <rect x="650" y="300" width="290" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665" y="321" font-size="13" font-weight="bold" fill="#166534">Tout périphérique → névrite</text>
  <text x="665" y="338" font-size="12" fill="#1f2937">HIT pathologique d'un côté + nystagmus</text>
  <text x="665" y="354" font-size="12" fill="#1f2937">unidirectionnel + pas de skew + audition</text>
  <text x="665" y="368" font-size="12" fill="#1f2937">inchangée + marche possible</text>

  <rect x="650" y="390" width="290" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="412" font-size="13" font-weight="bold" fill="#991b1b">Un seul signe central ou doute → AVC</text>
  <text x="665" y="429" font-size="12" fill="#1f2937">HIT NORMAL, nystagmus changeant de sens</text>
  <text x="665" y="445" font-size="12" fill="#1f2937">ou vertical, skew, surdité nouvelle,</text>
  <text x="665" y="461" font-size="12" fill="#1f2937">ataxie majeure → IRM diffusion + ARM,</text>
  <text x="665" y="475" font-size="12" fill="#1f2937">avis neurovasculaire (pas de TDM seul)</text>

  <!-- encadré ORL -->
  <rect x="20" y="500" width="920" height="88" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="35" y="522" font-size="14" font-weight="bold" fill="#9a3412">Contexte ORL (quel que soit le profil) : otoscopie anormale, surdité, otorrhée, traumatisme, barotraumatisme, chirurgie d'oreille</text>
  <text x="35" y="542" font-size="13" fill="#1f2937">→ labyrinthite (OMA, cholestéatome), fistule labyrinthique / périlymphatique, fracture translabyrinthique du rocher,</text>
  <text x="35" y="560" font-size="13" fill="#1f2937">zona auriculaire (vésicules + PF), surdité brusque avec vertige : avis ORL ; TDM des rochers si otite chronique/traumatisme,</text>
  <text x="35" y="578" font-size="13" fill="#1f2937">IRM si surdité de perception asymétrique.</text>

  <!-- traitement -->
  <rect x="20" y="602" width="920" height="96" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="35" y="624" font-size="14" font-weight="bold" fill="#1f2937">Traitement symptomatique (formes B et C) : le plus court possible</text>
  <text x="35" y="644" font-size="13" fill="#1f2937">antivertigineux + antiémétique, réhydratation si vomissements ; arrêt dès que possible (en pratique ≤ 72 h)</text>
  <text x="35" y="662" font-size="13" fill="#1f2937">pour ne pas freiner la compensation ; lever précoce ; rééducation vestibulaire si déficit.</text>
  <text x="35" y="682" font-size="13" fill="#1f2937">Hospitaliser si : suspicion centrale, marche impossible, vomissements incoercibles, cause ORL compliquée, isolement.</text>
</svg>
