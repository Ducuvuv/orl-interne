<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Otalgie : l'otoscopie trie entre otogène et réflexe</text>

  <!-- départ -->
  <rect x="250" y="48" width="460" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="480" y="73" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">OTALGIE → otoscopie des deux côtés</text>
  <text x="480" y="95" font-size="13" text-anchor="middle" fill="#1f2937">+ tragus, traction du pavillon, mastoïde, nerf facial, cou</text>

  <!-- flèches -->
  <line x1="380" y1="112" x2="250" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="250,150 262,140 266,152" fill="#374151"/>
  <line x1="580" y1="112" x2="710" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="710,150 694,152 698,140" fill="#374151"/>

  <!-- colonne gauche : otogène -->
  <rect x="20" y="152" width="440" height="48" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="240" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Otoscopie ANORMALE = otalgie otogène</text>

  <rect x="20" y="212" width="440" height="200" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="36" y="238" font-size="14" font-weight="bold" fill="#1f2937">Conduit</text>
  <text x="36" y="258" font-size="13" fill="#1f2937">otite externe (douleur au tragus), furoncle, otomycose,</text>
  <text x="36" y="276" font-size="13" fill="#1f2937">bouchon, corps étranger, vésicules de la conque (zona)</text>
  <text x="36" y="304" font-size="14" font-weight="bold" fill="#1f2937">Tympan</text>
  <text x="36" y="324" font-size="13" fill="#1f2937">OMA (tympan bombé), barotraumatisme, perforation,</text>
  <text x="36" y="342" font-size="13" fill="#1f2937">otite chronique, cholestéatome</text>
  <text x="36" y="370" font-size="14" font-weight="bold" fill="#1f2937">Pavillon, mastoïde</text>
  <text x="36" y="390" font-size="13" fill="#1f2937">périchondrite, othématome, mastoïdite (pavillon décollé)</text>

  <rect x="20" y="426" width="440" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="36" y="450" font-size="14" font-weight="bold" fill="#991b1b">Alerte : otite externe nécrosante ?</text>
  <text x="36" y="470" font-size="13" fill="#1f2937">diabétique âgé ou immunodéprimé, otalgie > 2 semaines</text>
  <text x="36" y="488" font-size="13" fill="#1f2937">malgré le traitement local, granulations du plancher</text>
  <text x="36" y="506" font-size="13" fill="#1f2937">du conduit, ± paralysie faciale → hospitalisation, senior</text>

  <!-- colonne droite : réflexe -->
  <rect x="500" y="152" width="440" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="720" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">Otoscopie NORMALE = otalgie réflexe</text>

  <rect x="500" y="212" width="440" height="200" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="516" y="238" font-size="14" font-weight="bold" fill="#1f2937">Chercher la cause projetée</text>
  <text x="516" y="262" font-size="13" fill="#1f2937">• dents (molaires, dents de sagesse)</text>
  <text x="516" y="284" font-size="13" fill="#1f2937">• ATM / SADAM : douleur prétragienne à la mastication</text>
  <text x="516" y="306" font-size="13" fill="#1f2937">• pharynx : angine, phlegmon, après amygdalectomie</text>
  <text x="516" y="328" font-size="13" fill="#1f2937">• cancer : oropharynx, hypopharynx, larynx, cavum</text>
  <text x="516" y="350" font-size="13" fill="#1f2937">• névralgie du IX ou du V, rachis cervical</text>
  <text x="516" y="380" font-size="13" font-weight="bold" fill="#1f2937">Examen : bouche, dents, ATM, palpation de la</text>
  <text x="516" y="398" font-size="13" font-weight="bold" fill="#1f2937">base de langue, nasofibroscopie, cou</text>

  <rect x="500" y="426" width="440" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="516" y="450" font-size="14" font-weight="bold" fill="#991b1b">Alerte : penser au cancer des VADS</text>
  <text x="516" y="470" font-size="13" fill="#1f2937">adulte, tabac-alcool, otalgie unilatérale > 3 semaines,</text>
  <text x="516" y="488" font-size="13" fill="#1f2937">dysphagie, dysphonie, crachats sanglants, adénopathie</text>
  <text x="516" y="506" font-size="13" fill="#1f2937">→ nasofibroscopie, puis panendoscopie si doute</text>

  <!-- pied -->
  <rect x="20" y="540" width="920" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="36" y="565" font-size="13" fill="#1f2937"><tspan font-weight="bold">Tympan non vu = otoscopie non faite</tspan> : retirer le cérumen ou nettoyer le conduit avant de conclure.</text>
  <text x="36" y="587" font-size="13" fill="#1f2937"><tspan font-weight="bold">Otalgie + vertige, paralysie faciale, céphalées ou fièvre élevée</tspan> → complication : avis senior.</text>
  <text x="36" y="609" font-size="13" fill="#1f2937"><tspan font-weight="bold">Enfant</tspan> : l'OMA est la cause la plus fréquente ; penser aussi corps étranger et angine.</text>
</svg>
