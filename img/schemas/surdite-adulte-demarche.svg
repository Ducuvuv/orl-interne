<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 742" width="760" height="742" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="742" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222">Surdité de l'adulte : démarche</text>
<rect x="110" y="46" width="540" height="87" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.4"/>
<text x="120.0" y="66.0" font-size="15" text-anchor="start" font-weight="bold" fill="#222">1. Examen + audiométrie</text>
<text x="120.0" y="85.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222">Otoscopie bilatérale + Weber / Rinne (diapason)</text>
<text x="120.0" y="103.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222">→ audiométrie tonale (CA + CO) + vocale ± tympanométrie,</text>
<text x="120.0" y="121.0" font-size="14" text-anchor="start" font-weight="normal" fill="#222">réflexes stapédiens (si tympan fermé)</text>
<line x1="300.0" y1="133.0" x2="200.0" y2="159.0" stroke="#616161" stroke-width="1.8"/>
<polygon points="200.0,159.0 207.4,152.2 209.7,161.3" fill="#616161"/>
<line x1="460.0" y1="133.0" x2="560.0" y2="159.0" stroke="#616161" stroke-width="1.8"/>
<polygon points="560.0,159.0 550.3,161.3 552.6,152.2" fill="#616161"/>
<rect x="20" y="161" width="350" height="83" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
<text x="30.0" y="180.0" font-size="14" text-anchor="start" font-weight="bold" fill="#0d47a1">TRANSMISSION</text>
<text x="30.0" y="198.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">CO normale, CA abaissée → Rinne audio. NÉGATIF</text>
<text x="30.0" y="215.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Weber latéralisé du côté SOURD</text>
<text x="30.0" y="232.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Jamais totale, pas de distorsion</text>
<rect x="40" y="262" width="330" height="117" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4"/>
<text x="50.0" y="281.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Otoscopie ANORMALE</text>
<text x="50.0" y="299.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Bouchon, otite externe, OMA, OSM</text>
<text x="50.0" y="316.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Perforation, poche, CHOLESTÉATOME</text>
<text x="50.0" y="333.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Hémotympan / fracture du rocher</text>
<text x="50.0" y="350.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">→ TDM rochers si otite chronique/cholestéatome</text>
<text x="50.0" y="367.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">   (± IRM diffusion si doute cholestéatome)</text>
<line x1="28.0" y1="276.0" x2="40.0" y2="276.0" stroke="#1565c0" stroke-width="1.8"/>
<polygon points="40.0,276.0 31.2,280.7 31.2,271.3" fill="#1565c0"/>
<line x1="28" y1="244" x2="28" y2="405" stroke="#1565c0" stroke-width="1.8"/>
<line x1="28.0" y1="405.0" x2="40.0" y2="405.0" stroke="#1565c0" stroke-width="1.8"/>
<polygon points="40.0,405.0 31.2,409.7 31.2,400.3" fill="#1565c0"/>
<rect x="40" y="391" width="330" height="117" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4"/>
<text x="50.0" y="410.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Tympan NORMAL</text>
<text x="50.0" y="428.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">OTOSPONGIOSE (femme jeune, ATCD familiaux) :</text>
<text x="50.0" y="445.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">tympanogramme normal, réflexe stapédien aboli,</text>
<text x="50.0" y="462.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">encoche de Carhart (CO ~2 kHz) → TDM rochers</text>
<text x="50.0" y="479.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Autres : lyse/luxation ossiculaire, aplasie mineure,</text>
<text x="50.0" y="496.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">tympanosclérose, tumeur (rare)</text>
<rect x="390" y="161" width="350" height="83" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="1.4"/>
<text x="400.0" y="180.0" font-size="14" text-anchor="start" font-weight="bold" fill="#880e4f">PERCEPTION</text>
<text x="400.0" y="198.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">CA = CO abaissées → Rinne audio. POSITIF</text>
<text x="400.0" y="215.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Weber latéralisé du côté SAIN</text>
<text x="400.0" y="232.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Distorsions, recrutement, gêne dans le bruit</text>
<line x1="730" y1="244" x2="730" y2="449" stroke="#c2185b" stroke-width="1.8"/>
<rect x="390" y="262" width="330" height="66" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
<text x="400.0" y="281.0" font-size="14" text-anchor="start" font-weight="bold" fill="#b71c1c">BRUTALE = URGENCE</text>
<text x="400.0" y="299.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">≥ 30 dB / 3 fréq. consécutives en &lt; 72 h</text>
<text x="400.0" y="316.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">→ SURDITÉ BRUSQUE : corticoïdes sans délai</text>
<line x1="730.0" y1="276.0" x2="722.0" y2="276.0" stroke="#c2185b" stroke-width="1.8"/>
<polygon points="722.0,276.0 730.8,271.3 730.8,280.7" fill="#c2185b"/>
<rect x="390" y="340" width="330" height="83" rx="8" fill="#ffffff" stroke="#c2185b" stroke-width="1.4"/>
<text x="400.0" y="359.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">UNILATÉRALE / ASYMÉTRIQUE</text>
<text x="400.0" y="377.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">ou acouphène unilatéral, vertiges, fluctuante</text>
<text x="400.0" y="394.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">→ IRM encéphale + CAI (schwannome</text>
<text x="400.0" y="411.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">   vestibulaire, Menière, autre lésion)</text>
<line x1="730.0" y1="354.0" x2="722.0" y2="354.0" stroke="#c2185b" stroke-width="1.8"/>
<polygon points="722.0,354.0 730.8,349.3 730.8,358.7" fill="#c2185b"/>
<rect x="390" y="435" width="330" height="83" rx="8" fill="#ffffff" stroke="#c2185b" stroke-width="1.4"/>
<text x="400.0" y="454.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">BILATÉRALE SYMÉTRIQUE progressive</text>
<text x="400.0" y="472.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Presbyacousie, traumatisme sonore (4 kHz),</text>
<text x="400.0" y="489.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">ototoxiques, génétique, évolutive du jeune</text>
<text x="400.0" y="506.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">→ PAS d'imagerie systématique</text>
<line x1="730.0" y1="449.0" x2="722.0" y2="449.0" stroke="#c2185b" stroke-width="1.8"/>
<polygon points="722.0,449.0 730.8,444.3 730.8,453.7" fill="#c2185b"/>
<rect x="20" y="546" width="720" height="66" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
<text x="30.0" y="565.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">Asymétrie significative (SFORL 2022) = IRM</text>
<text x="30.0" y="583.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">≥ 20 dB sur 2 fréquences voisines, OU ≥ 15 dB sur 3 kHz, OU ≥ 15 dB sur 2 fréquences entre 2 et 8 kHz,</text>
<text x="30.0" y="600.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">OU différence de PTM (500-1000-2000-4000 Hz) &gt; 15 dB → IRM des CAI / angles ponto-cérébelleux</text>
<rect x="20" y="626" width="720" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="30.0" y="645.0" font-size="14" text-anchor="start" font-weight="bold" fill="#1b5e20">Réhabilitation</text>
<text x="30.0" y="663.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Prothèses auditives (stéréophoniques si bilatéral) dès PTM &gt; 30 dB, ou seuil d'intelligibilité &gt; 30 dB,</text>
<text x="30.0" y="680.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">ou gêne dans le bruit (RSB &gt; 3 dB hors norme) — 100 % Santé classe I, renouvellement ≥ 4 ans.</text>
<text x="30.0" y="697.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Implant cochléaire si intelligibilité ≤ 50 % à 60 dB en champ libre avec prothèses bien réglées (HAS).</text>
<text x="30.0" y="714.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222">+ orthophonie (lecture labiale), aides techniques, MDPH.</text>
</svg>